name: build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Install Android platform and build tools
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then SDKM=sdkmanager; else SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug and run unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tools compile check
        run: python3 -m py_compile tools/*.py
